lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    tslib:
      specifier: ~2.3.1
      version: 2.3.1
    typescript:
      specifier: ~5.8.2
      version: 5.8.3
  tools:
    eslint:
      specifier: ~9.37.0
      version: 9.37.0

importers:
  .: {}

  ../../apps/app-a:
    dependencies:
      lib-b:
        specifier: workspace:*
        version: link:../../libs/lib-b
      tslib:
        specifier: catalog:default
        version: 2.3.1
      typescript:
        specifier: 'catalog:'
        version: 5.8.3
    devDependencies:
      eslint:
        specifier: catalog:tools
        version: 9.37.0

packages:
  eslint@9.37.0:
