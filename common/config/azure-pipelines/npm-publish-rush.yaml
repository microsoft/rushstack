trigger:
  branches:
    include:
      - main
  paths:
    include:
      - '**/CHANGELOG.md'
      - 'common/config/rush/version-policies.json'

pr: none

parameters:
  - name: publishToNpmFeed
    displayName: 'Publish to npm feed'
    type: boolean
    default: true
  - name: NpmTag
    displayName: 'NPM dist-tag'
    type: string
    default: latest
  - name: DryRun
    displayName: 'Dry run'
    type: boolean
    default: false
  - name: CommitShaOverride
    displayName: 'Commit SHA Override (for testing)'
    type: string
    default: ''

variables:
  - name: FORCE_COLOR
    value: 1
  - name: RushstackVersioningProject
    value: GitHubProjects
  # Pipeline definition ID of the Rushstack bump-versions pipeline.
  - name: RushstackVersioningPipelineId
    value: 0
  - name: PackagesPath
    value: $(Pipeline.Workspace)/packages

resources:
  repositories:
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: publishConfig
      type: git
      name: GitHubProjectsPublish/GitHubProjectsPublish
      ref: refs/heads/main

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      os: windows
    stages:
      - stage: Prepare
        dependsOn: []
        displayName: 'Prepare Rush NPM Publish'
        jobs:
          - job: PrepareNpmPublish
            displayName: 'Prepare Rush NPM Publish'
            pool:
              name: publish-rushstack
              os: linux
            templateContext:
              outputParentDirectory: $(Build.ArtifactStagingDirectory)
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/published-versions
                  artifactName: published-versions
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/json-schemas
                  artifactName: json-schemas
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/api
                  artifactName: api
            steps:
              - checkout: self
                persistCredentials: true

              - template: /common/config/azure-pipelines/templates/install-node.yaml@self

              - bash: |
                  mkdir -p "$(Build.ArtifactStagingDirectory)/published-versions"
                  mkdir -p "$(Build.ArtifactStagingDirectory)/json-schemas"
                  mkdir -p "$(Build.ArtifactStagingDirectory)/api"
                displayName: 'Initialize artifact staging directories'
                condition: always()

              - template: /common/config/azure-pipelines/templates/find-bump-pipeline-run.yaml@self
                parameters:
                  PipelineId: $(RushstackVersioningPipelineId)
                  CommitSha: ${{ coalesce(parameters.CommitShaOverride, '$(Build.SourceVersion)') }}
                  TeamProject: $(RushstackVersioningProject)
                  Name: FindBumpRun
                  WorkingDirectory: $(Build.SourcesDirectory)

              - task: DownloadPipelineArtifact@2
                condition: eq(variables['FindBumpRun.IsVersionBumpMerge'], 'true')
                inputs:
                  artifactName: package-versions
                  targetPath: $(Agent.TempDirectory)/package-versions
                  project: $(RushstackVersioningProject)
                  definition: $(RushstackVersioningPipelineId)
                  pipelineId: $(FindBumpRun.BumpPipelineRunId)
                  buildType: specific
                  buildVersionToDownload: specific
                displayName: 'Download package versions'

              - bash: |
                  cp "$(Agent.TempDirectory)/package-versions"/*.json "$(Build.ArtifactStagingDirectory)/published-versions/"
                condition: eq(variables['FindBumpRun.IsVersionBumpMerge'], 'true')
                displayName: 'Stage published versions artifact'

              - task: DownloadPipelineArtifact@2
                condition: eq(variables['FindBumpRun.IsVersionBumpMerge'], 'true')
                inputs:
                  artifactName: json-schemas
                  targetPath: $(Build.ArtifactStagingDirectory)/json-schemas
                  project: $(RushstackVersioningProject)
                  definition: $(RushstackVersioningPipelineId)
                  pipelineId: $(FindBumpRun.BumpPipelineRunId)
                  buildType: specific
                  buildVersionToDownload: specific
                displayName: 'Download JSON schema artifact'

              - task: DownloadPipelineArtifact@2
                condition: eq(variables['FindBumpRun.IsVersionBumpMerge'], 'true')
                inputs:
                  artifactName: api
                  targetPath: $(Build.ArtifactStagingDirectory)/api
                  project: $(RushstackVersioningProject)
                  definition: $(RushstackVersioningPipelineId)
                  pipelineId: $(FindBumpRun.BumpPipelineRunId)
                  buildType: specific
                  buildVersionToDownload: specific
                displayName: 'Download API review artifact'

      - ${{ if eq(parameters.publishToNpmFeed, true) }}:
          - stage: Publish
            displayName: 'Publish Rush NPM Packages'
            dependsOn:
              - Prepare
            condition: and(succeeded('Prepare'), eq(dependencies.Prepare.outputs['PrepareNpmPublish.FindBumpRun.IsVersionBumpMerge'], 'true'))
            jobs:
              - job: PublishNpmPackages
                displayName: 'Publish Rush NPM Packages'
                pool:
                  name: publish-rushstack
                  os: linux
                variables:
                  - name: BumpPipelineRunId
                    value: $[ stageDependencies.Prepare.PrepareNpmPublish.outputs['FindBumpRun.BumpPipelineRunId'] ]
                templateContext:
                  type: releaseJob
                  isProduction: true
                steps:
                  - checkout: none

                  - template: /common/config/azure-pipelines/templates/install-node.yaml@self

                  - task: 1ES.DownloadPipelineArtifact@1
                    inputs:
                      artifactName: packages
                      targetPath: $(PackagesPath)
                      project: $(RushstackVersioningProject)
                      definition: $(RushstackVersioningPipelineId)
                      pipelineId: $(BumpPipelineRunId)
                      buildType: specific
                      buildVersionToDownload: specific
                    displayName: 'Download packed npm packages'

                  - bash: |
                      ls -la "$(PackagesPath)"
                    displayName: 'List downloaded packages'

                  - template: /common/config/azure-pipelines/templates/esrp-release.yaml@publishConfig
                    parameters:
                      packagesPath: $(PackagesPath)
                      npmTag: ${{ parameters.NpmTag }}
                      dryRun: ${{ parameters.DryRun }}
