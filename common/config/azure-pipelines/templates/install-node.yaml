parameters:
  - name: NodeVersion
    type: string
    default: '24.22.1'

steps:
  # The publish-rushstack pool's ubuntu-24-minimal image leaves the agent tool cache owned by root,
  # so NodeTool fails with EACCES when it caches a downloaded Node.js version. Make the node cache
  # folder writable by the agent user before installing.
  - bash: |
      set -euo pipefail
      NODE_CACHE_DIR="$(Agent.ToolsDirectory)/node"
      if ! mkdir -p "$NODE_CACHE_DIR" 2>/dev/null || [ ! -w "$NODE_CACHE_DIR" ]; then
        echo "Making $NODE_CACHE_DIR writable by $(id -un)"
        sudo -n mkdir -p "$NODE_CACHE_DIR"
        sudo -n chown "$(id -u):$(id -g)" "$NODE_CACHE_DIR"
      fi
    displayName: 'Ensure Node.js tool cache is writable'
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  - task: NodeTool@0
    inputs:
      versionSpec: '${{ parameters.NodeVersion }}'
    displayName: 'Install Node.js ${{ parameters.NodeVersion }}'

  - bash: |
      cat > "$HOME/.npmrc" <<'EOF'
      registry=https://packagefeedproxy.microsoft.io/npm/
      EOF
    displayName: 'Set user npm registry to packagefeedproxy'

  - bash: npm config list
    displayName: 'Show npm configuration'
