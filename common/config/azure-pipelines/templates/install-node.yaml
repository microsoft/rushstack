parameters:
  - name: NodeVersion
    type: string
    default: '24.22.1'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '${{ parameters.NodeVersion }}'
    displayName: 'Install Node.js ${{ parameters.NodeVersion }}'

  - bash: |
      cat > "$HOME/.npmrc" <<'EOF'
      registry=https://packagefeedproxy.microsoft.io/npm/
      EOF
    displayName: 'Set user npm registry to packagefeedproxy'

  - bash: npm config list
    displayName: 'Show npm configuration'
